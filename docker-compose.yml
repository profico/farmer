services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: farmer
      POSTGRES_PASSWORD: farmer
      POSTGRES_DB: farmer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
