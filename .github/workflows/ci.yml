name: CI

on:
  push:
    branches: [main]
    # A release: `v1.2.3`. `cli-v*` and `mobile-v*` do not match, because a glob
    # must match the whole tag name from its first character.
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check`, not `lint`, and from the ROOT — this step used to be neither,
      # and each half was a hole:
      #   * `lint` alone ignores formatting and import order, so both drifted
      #     without ever failing a build.
      #   * running it in apps/web meant the linter only ever saw that
      #     workspace; packages/core — the services, the jobs, the schema, about
      #     half the code — was never linted or formatted at all.
      # The root `oxlint.config.ts` and `.oxfmtrc.json` cover both workspaces;
      # each workspace's own `check` script points back at the root config so
      # `bun run check` still works from inside either one.
      - name: Lint, format and import order
        run: bun run check

      # The CLI and the apps read `/api/v1` through these files. A change to a
      # route that does not regenerate them fails here, not in a client.
      - name: OpenAPI is up to date
        run: |
          bun run --cwd packages/api-client generate
          git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/openapi.gen.ts

      # Through turbo, like every other step, rather than two hand-written
      # `bunx tsc` invocations with a `working-directory`. Those were the only
      # check in this file that a developer could not run locally — there was no
      # `typecheck` script anywhere, so type errors surfaced in an editor or in
      # CI and nowhere in between, and a workspace added later would have had to
      # be remembered here by hand.
      - name: Typecheck
        run: bun run typecheck

      # The action only installs cccc (no `path`). The step after it runs the
      # same script as a developer, so CI and a local run use one command.
      # Keep `version` the same as the binary in the AGENTS.md instructions.
      # The action ref is a commit sha, not a tag. A tag can move, and this
      # third-party action runs with the job token.
      - name: Install cccc
        uses: moznion/cccc-action@1d5313811f8451953e46a268c61791a01e40b7df # v1.1.2
        with:
          version: v1.7.0

      - name: Complexity
        run: bun run complexity

      # packages/core's suite runs against PGLite (real Postgres in-process, see
      # src/test/harness.ts), so this step needs no service container and no
      # DATABASE_URL. It previously ran vitest in apps/web — a workspace with no
      # test files and no vitest dependency — so it passed unconditionally and
      # the three real tests in packages/core ran nowhere.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Every new commit, scanned for credentials before it is merged. The
  # repository is public, so a secret that reaches main is published.
  #
  # TruffleHog's action scans only the commits this event brings: a pull
  # request's commits, or a push's. `--only-verified` keeps it quiet: a finding
  # fails the job only when TruffleHog has checked, against the provider, that
  # the credential works. The test fixtures hold key-shaped strings on purpose,
  # and none of them works. It needs no secret, so it runs the same on a fork's
  # pull request. A full-history scan is a one-off, not a CI job (issue #75).
  secrets:
    name: Scan new commits for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The action diffs the event's base and head, so both must be here.
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: 3.97.6
          extra_args: --only-verified

  # Whether this repository deploys at all. A job's `if` cannot read a secret,
  # so this job reads it into an output. A fork has no COOLIFY_WEBHOOK_URL, and
  # then the nightly image is not built or pushed either: nothing would pull it.
  # Upstream, the secret is set and the deploy runs as before.
  # A release tag needs no secret: it only pushes an image, so a fork can
  # publish its own release.
  deploy-gate:
    name: Check the deploy target
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Is COOLIFY_WEBHOOK_URL set?
        id: check
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ] || [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::COOLIFY_WEBHOOK_URL is not set, so this repository does not deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the production image for amd64 and arm64, one native runner each, so
  # no QEMU. `image` pushes each platform by digest only; `deploy` joins the two
  # digests into one multi-platform manifest under the tags below. A Coolify
  # "Docker Image" resource can then pull ghcr.io/<owner>/<repository>:nightly,
  # and the last step tells it to pull and restart.
  #
  # Tags by trigger:
  #   * a push to main: `nightly` and `sha-<long sha>`. Not `latest`.
  #   * a `v*` tag: `<version>`, `<major>.<minor>`, `<major>` and `latest`.
  #     A pre-release tag (`v1.2.3-rc.1`) gets only `<version>`.
  # A tag does not call the Coolify webhook.
  #
  # Only on a push to main or a `v*` tag, and only where `deploy-gate` allowed
  # it (a tag always, main only with the Coolify secret). A pull request never
  # deploys, from a fork or not.
  image:
    name: Build image (${{ matrix.arch }})
    needs: [ci, deploy-gate]
    if: github.event_name == 'push' && needs.deploy-gate.outputs.enabled == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # What the running deployment reports at the foot of Settings. The
          # image is built from this commit, so this is the only place that
          # knows it; see GIT_SHA in the Dockerfile. SERVER_VERSION is the
          # release for a `v*` tag, and empty for a nightly build.
          build-args: |
            GIT_SHA=${{ github.sha }}
            SERVER_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # The digest is an image index that holds the image, its provenance
          # and its SBOM. `imagetools create` in `deploy` copies the
          # attestation manifests of each source index into the joined index.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Save the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Tag image, deploy to Coolify
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=auto` adds `latest` for a stable semver tag only.
          flavor: latest=auto
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      # Only main: our instance runs `nightly`. A release tag deploys nothing.
      - name: Trigger Coolify deploy
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail-with-body -sS -H "Authorization: Bearer $API_TOKEN" "$WEBHOOK_URL"

  # The push relay's image (apps/push-relay, ADR 0006). It builds only on a push
  # to main, and only where `deploy-gate` found the Coolify secret. It does not call the web app's Coolify webhook.
  # The relay is a separate Coolify resource that pulls
  # ghcr.io/<owner>/farmer-push-relay:latest.
  #
  # The build context is the repo root, because the frozen install needs the
  # root lockfile. The cache has its own scope, so the two images do not push
  # each other out of the GitHub Actions cache. The relay is small, so QEMU
  # builds the second platform here.
  push-relay-image:
    name: Build and push the push relay image
    needs: [ci, deploy-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/farmer-push-relay
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/push-relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=push-relay
          cache-to: type=gha,mode=max,scope=push-relay

  # The public site's image (apps/site, issue 234). Same triggers and the same
  # gate as the push relay. The site is built for farmer.profi.co only, and the
  # product image does not contain it. The build reads the releases and the
  # recent commits from GitHub, so the workflow token goes in as a build secret
  # (the build uses it for the API rate limit and does not keep it), and
  # SITE_STRICT_RELEASES makes a failed read fail the build.
  # The deploy step runs only where COOLIFY_SITE_WEBHOOK is set.
  site-image:
    name: Build and push the site image
    needs: [ci, deploy-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/farmer-site
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/site/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

      - name: Trigger Coolify deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_SITE_WEBHOOK }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::COOLIFY_SITE_WEBHOOK is not set, so the site is not deployed."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $API_TOKEN" "$WEBHOOK_URL"
