name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (apps/web)
        working-directory: apps/web
        run: bun run lint

      - name: Typecheck (apps/web)
        working-directory: apps/web
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Typecheck (packages/core)
        working-directory: packages/core
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Test (apps/web)
        working-directory: apps/web
        # --passWithNoTests: no test files exist yet, but the step should
        # still run (and start failing the moment a test does) rather than
        # being skipped outright.
        run: bunx vitest run --passWithNoTests

      - name: Build
        run: bun run build
