name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check`, not `lint`, and from the ROOT — this step used to be neither,
      # and each half was a hole:
      #   * `lint` alone ignores formatting and import order, so both drifted
      #     without ever failing a build.
      #   * running it in apps/web meant the linter only ever saw that
      #     workspace; packages/core — the services, the jobs, the schema, about
      #     half the code — was never linted or formatted at all.
      # The root `oxlint.config.ts` and `.oxfmtrc.json` cover both workspaces;
      # each workspace's own `check` script points back at the root config so
      # `bun run check` still works from inside either one.
      - name: Lint, format and import order
        run: bun run check

      # Through turbo, like every other step, rather than two hand-written
      # `bunx tsc` invocations with a `working-directory`. Those were the only
      # check in this file that a developer could not run locally — there was no
      # `typecheck` script anywhere, so type errors surfaced in an editor or in
      # CI and nowhere in between, and a workspace added later would have had to
      # be remembered here by hand.
      - name: Typecheck
        run: bun run typecheck

      # packages/core's suite runs against PGLite (real Postgres in-process, see
      # src/test/harness.ts), so this step needs no service container and no
      # DATABASE_URL. It previously ran vitest in apps/web — a workspace with no
      # test files and no vitest dependency — so it passed unconditionally and
      # the three real tests in packages/core ran nowhere.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Build the production image here instead of on the Coolify host — that host
  # builds --no-cache on a shared arm64 box, which has corrupted tarballs and
  # hung installs (see the retry loops in the Dockerfile). Coolify's app is a
  # "Docker Image" resource pointing at ghcr.io/profico/farmer:latest; the last
  # step just tells it to pull and restart.
  #
  # ubuntu-24.04-arm is a native arm64 runner, matching the Coolify host's arch
  # with no QEMU. If your plan doesn't provide arm runners for private repos,
  # switch runs-on to ubuntu-latest and add docker/setup-qemu-action@v3 before
  # buildx — same result, much slower build.
  deploy:
    name: Build image, deploy to Coolify
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::COOLIFY_WEBHOOK_URL secret not set — image pushed, deploy trigger skipped"
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $API_TOKEN" "$WEBHOOK_URL"
