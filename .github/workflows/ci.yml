name: CI

on:
  push:
    branches: [main]
    # A release: `v1.2.3`. `cli-v*` and `mobile-v*` do not match, because a glob
    # must match the whole tag name from its first character.
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check`, not `lint`, and from the ROOT — this step used to be neither,
      # and each half was a hole:
      #   * `lint` alone ignores formatting and import order, so both drifted
      #     without ever failing a build.
      #   * running it in apps/web meant the linter only ever saw that
      #     workspace; packages/core — the services, the jobs, the schema, about
      #     half the code — was never linted or formatted at all.
      # The root `oxlint.config.ts` and `.oxfmtrc.json` cover both workspaces;
      # each workspace's own `check` script points back at the root config so
      # `bun run check` still works from inside either one.
      - name: Lint, format and import order
        run: bun run check

      # Through turbo, like every other step, rather than two hand-written
      # `bunx tsc` invocations with a `working-directory`. Those were the only
      # check in this file that a developer could not run locally — there was no
      # `typecheck` script anywhere, so type errors surfaced in an editor or in
      # CI and nowhere in between, and a workspace added later would have had to
      # be remembered here by hand.
      - name: Typecheck
        run: bun run typecheck

      # The action only installs cccc (no `path`). The step after it runs the
      # same script as a developer, so CI and a local run use one command.
      # Keep `version` the same as the binary in the AGENTS.md instructions.
      # The action ref is a commit sha, not a tag. A tag can move, and this
      # third-party action runs with the job token.
      - name: Install cccc
        uses: moznion/cccc-action@f766d74cf323cd9085c2c9263cebdf1ec1ebfb19 # v1.1.1
        with:
          version: v1.7.0

      - name: Complexity
        run: bun run complexity

      # packages/core's suite runs against PGLite (real Postgres in-process, see
      # src/test/harness.ts), so this step needs no service container and no
      # DATABASE_URL. It previously ran vitest in apps/web — a workspace with no
      # test files and no vitest dependency — so it passed unconditionally and
      # the three real tests in packages/core ran nowhere.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Every new commit, scanned for credentials before it is merged. The
  # repository is public, so a secret that reaches main is published.
  #
  # TruffleHog's action scans only the commits this event brings: a pull
  # request's commits, or a push's. `--only-verified` keeps it quiet: a finding
  # fails the job only when TruffleHog has checked, against the provider, that
  # the credential works. The test fixtures hold key-shaped strings on purpose,
  # and none of them works. It needs no secret, so it runs the same on a fork's
  # pull request. A full-history scan is a one-off, not a CI job (issue #75).
  secrets:
    name: Scan new commits for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The action diffs the event's base and head, so both must be here.
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.97.6
        with:
          version: 3.97.6
          extra_args: --only-verified

  # Whether this repository deploys at all. A job's `if` cannot read a secret,
  # so this job reads it into an output. A fork has no COOLIFY_WEBHOOK_URL, and
  # then the nightly image is not built or pushed either: nothing would pull it.
  # Upstream, the secret is set and the deploy runs as before.
  # A release tag needs no secret: it only pushes an image, so a fork can
  # publish its own release.
  deploy-gate:
    name: Check the deploy target
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Is COOLIFY_WEBHOOK_URL set?
        id: check
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ] || [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::COOLIFY_WEBHOOK_URL is not set, so this repository does not deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the production image here instead of on the Coolify host — that host
  # builds --no-cache on a shared arm64 box, which has corrupted tarballs and
  # hung installs (see the retry loops in the Dockerfile). Coolify's app is a
  # "Docker Image" resource pointing at ghcr.io/<owner>/<repository>:nightly;
  # the last step just tells it to pull and restart.
  #
  # Tags by trigger:
  #   * a push to main: `nightly` and `sha-<long sha>`. Not `latest`.
  #   * a `v*` tag: `<version>`, `<major>.<minor>`, `<major>` and `latest`.
  #     A pre-release tag (`v1.2.3-rc.1`) gets only `<version>`.
  # A tag does not call the Coolify webhook.
  #
  # Only on a push to main or a `v*` tag, and only where `deploy-gate` allowed
  # it (a tag always, main only with the Coolify secret). A pull request never
  # deploys, from a fork or not.
  #
  # ubuntu-24.04-arm is a native arm64 runner, matching the Coolify host's arch
  # with no QEMU. If your plan doesn't provide arm runners, switch runs-on to
  # ubuntu-latest and add docker/setup-qemu-action@v3 before buildx — same
  # result, much slower build.
  deploy:
    name: Build image, deploy to Coolify
    needs: [ci, deploy-gate]
    if: github.event_name == 'push' && needs.deploy-gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=auto` adds `latest` for a stable semver tag only.
          flavor: latest=auto
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # What the running deployment reports at the foot of Settings. The
          # image is built from this commit, so this is the only place that
          # knows it — see GIT_SHA in the Dockerfile. SERVER_VERSION is the
          # release for a `v*` tag, and empty for a nightly build.
          build-args: |
            GIT_SHA=${{ github.sha }}
            SERVER_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only main: our instance runs `nightly`. A release tag deploys nothing.
      - name: Trigger Coolify deploy
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail-with-body -sS -H "Authorization: Bearer $API_TOKEN" "$WEBHOOK_URL"

  # The push relay's image (apps/push-relay, ADR 0006). It has the same
  # conditions as `deploy`: only a push to main, and only where `deploy-gate`
  # found the Coolify secret. It does not call the web app's Coolify webhook.
  # The relay is a separate Coolify resource that pulls
  # ghcr.io/<owner>/farmer-push-relay:latest.
  #
  # The build context is the repo root, because the frozen install needs the
  # root lockfile. The cache has its own scope, so the two images do not push
  # each other out of the GitHub Actions cache.
  push-relay-image:
    name: Build and push the push relay image
    needs: [ci, deploy-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/farmer-push-relay
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/push-relay/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=push-relay
          cache-to: type=gha,mode=max,scope=push-relay
