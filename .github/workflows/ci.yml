name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check`, not `lint`, and from the ROOT — this step used to be neither,
      # and each half was a hole:
      #   * `lint` alone ignores formatting and import order, so both drifted
      #     without ever failing a build.
      #   * running it in apps/web meant biome only ever saw that workspace;
      #     packages/core — the services, the jobs, the schema, about half the
      #     code — was never linted or formatted at all.
      # The root biome.json covers both workspaces (each has a thin
      # `extends: "//"` config so `bun run check` still works inside them).
      - name: Lint, format and import order
        run: bun run check

      - name: Typecheck (apps/web)
        working-directory: apps/web
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Typecheck (packages/core)
        working-directory: packages/core
        run: bunx tsc --noEmit -p tsconfig.json

      # packages/core's suite runs against PGLite (real Postgres in-process, see
      # src/test/harness.ts), so this step needs no service container and no
      # DATABASE_URL. It previously ran vitest in apps/web — a workspace with no
      # test files and no vitest dependency — so it passed unconditionally and
      # the three real tests in packages/core ran nowhere.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
