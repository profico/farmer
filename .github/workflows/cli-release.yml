name: CLI release

# Publishes the command-line tool's binaries. Push a tag to run it:
#
#   git tag cli-v0.1.0 && git push origin cli-v0.1.0
#
# The web app's install script (`curl -fsSL <origin>/cli | sh`) downloads from
# the newest release whose tag starts with `cli-v`, in the repository named by
# CLI_RELEASES_REPO (see .env.example). The server reads the public release
# list with no token, so a release published here is live for every deployment
# within about five minutes, which is how long the server caches the lookup.
#
# A fork runs this as is: nothing here needs a secret, and a `cli-v*` tag
# pushed to the fork publishes to the fork's own releases, with the fork's own
# `github.token`. Point the fork's deployment at it with CLI_RELEASES_REPO.
#
# Three jobs, and nothing is published until every binary has run:
#
#   build    cross-compiles all seven targets on Linux.
#   smoke    runs each binary on its own OS and CPU. The two macOS binaries are
#            re-signed there first (see that step), so what it uploads is what
#            ships.
#   publish  adds a .gz copy of each binary that ran, writes SHA256SUMS over
#            all of them, and creates the release. Tags only.
#
# A pull request that touches the CLI runs build and smoke too, without
# publishing, so a broken target shows up before a tag does.
#
# `bun.lock` is in the paths above because one lockfile serves every workspace,
# so a dependency bump anywhere can break the CLI build. It also means a
# web-only pull request that adds one package lands here. Such a run builds and
# stops: `build` proves the CLI still compiles against the new dependency graph,
# and `smoke` is skipped, because running seven binaries to learn that a
# lockfile bump did not change them spends two macOS runners (billed at ten
# times the rate) on a question nobody asked.

on:
  push:
    tags: ["cli-v*"]
  pull_request:
    paths:
      - "apps/cli/**"
      - "bun.lock"
      - ".github/workflows/cli-release.yml"

# Never cancel a release half way: a cancelled run can leave a release with only
# some of its assets, and the install script would then 404 on the missing ones.
# A pull request's run is only a check, so a newer push replaces it.
concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the CLI binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      cli-changed: ${{ steps.scope.outputs.cli-changed }}
    steps:
      # Depth 2 on a pull request: the checked-out commit is the merge of the
      # base and the head, and the step below diffs it against its first
      # parent, which is the base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # Whether `smoke` runs. Anything that is not a pull request — a tag — is
      # a release, and a release runs every binary.
      - name: Did this pull request touch the CLI?
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "cli-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD -- apps/cli .github/workflows/cli-release.yml)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "cli-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file under apps/cli changed. The binaries are built, not run."
            echo "cli-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The tag is what the install script and the release title show, and
      # `apps/cli/package.json` is what the binary reports as its own version
      # (and sends to the server, which refuses a binary older than
      # `minCliVersion`). A release where the two disagree is a binary that
      # lies about what it is, so it fails here rather than after it ships.
      - name: Read the version, and check the tag matches it
        id: version
        run: |
          package_version="$(bun -e 'console.log((await Bun.file("apps/cli/package.json").json()).version)')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#cli-v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME is version $tag_version, but apps/cli/package.json is $package_version"
              exit 1
            fi
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      # `bun build --compile --target` cross-compiles, so one Linux runner
      # builds every target. It also writes a SHA256SUMS, which is left behind
      # on purpose: the macOS binaries change when they are re-signed, and
      # publish writes the sums again over the final files.
      - name: Build the binaries
        working-directory: apps/cli
        run: bun run build:release

      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-binaries
          path: apps/cli/dist/release/farmer-*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Run ${{ matrix.asset }}
    needs: build
    if: needs.build.outputs.cli-changed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every target is reported, not just the first to fail.
      fail-fast: false
      matrix:
        include:
          - { asset: farmer-linux-x64, runner: ubuntu-latest }
          - { asset: farmer-linux-arm64, runner: ubuntu-24.04-arm }
          - { asset: farmer-linux-x64-musl, runner: ubuntu-latest, alpine: true }
          - { asset: farmer-linux-arm64-musl, runner: ubuntu-24.04-arm, alpine: true }
          - { asset: farmer-darwin-arm64, runner: macos-latest, sign: true }
          - { asset: farmer-darwin-x64, runner: macos-15-intel, sign: true }
          - { asset: farmer-windows-x64.exe, runner: windows-latest }
    defaults:
      run:
        shell: bash
    env:
      ASSET: ${{ matrix.asset }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: bin

      # A Bun cross-compile does not leave a valid code signature on a macOS
      # binary. Checked on Bun 1.3.14 and 1.4.0: darwin-x64 keeps Bun's own
      # signature over bytes the embedded app has since changed, and darwin-arm64
      # gets an ad-hoc signature whose last page hash is wrong. Apple silicon
      # kills a binary whose signature does not match ("Killed: 9"), and newer
      # macOS versions are stricter on Intel too. An ad-hoc signature made here
      # matches the file. It is not a Developer ID signature, and it does not
      # need to be: `curl` sets no quarantine attribute, so Gatekeeper does not
      # check a binary the install script downloads.
      - name: Re-sign for macOS
        if: matrix.sign
        run: |
          codesign --force --sign - "bin/$ASSET"
          codesign --verify --strict --verbose=2 "bin/$ASSET"

      # Artifacts do not keep the executable bit, so it is set again here. The
      # install script sets it too; release assets carry no mode at all.
      - name: Run the binary
        if: ${{ !matrix.alpine }}
        run: |
          chmod +x "bin/$ASSET"
          output="$("./bin/$ASSET" --version | tr -d '\r')"
          echo "$output"
          if [ "$output" != "farmer $VERSION" ]; then
            echo "::error::$ASSET printed \"$output\", expected \"farmer $VERSION\""
            exit 1
          fi

      # Bun's musl runtime links libstdc++ and libgcc dynamically, and Alpine
      # leaves both out of its base image. The install script checks for them
      # before it downloads anything; this runs the binary the way that check
      # expects a system to be.
      - name: Run the binary on Alpine
        if: matrix.alpine
        run: |
          chmod +x "bin/$ASSET"
          output="$(docker run --rm -v "$PWD/bin:/farmer:ro" alpine:3.20 \
            sh -c "apk add --no-cache -q libstdc++ libgcc >/dev/null && /farmer/$ASSET --version")"
          echo "$output"
          if [ "$output" != "farmer $VERSION" ]; then
            echo "::error::$ASSET printed \"$output\", expected \"farmer $VERSION\""
            exit 1
          fi

      - name: Upload the re-signed binary
        if: matrix.sign
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-signed-${{ matrix.asset }}
          path: bin/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [build, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` writes a release and uploads its assets.
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # First, because `actions/checkout` cleans the workspace and would take
      # the downloaded binaries with it. The history is here for the notes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-binaries
          path: release

      - name: Download the re-signed macOS binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-signed-*
          path: signed
          merge-multiple: true

      - name: Replace the macOS binaries, compress them and write SHA256SUMS
        run: |
          cp -f signed/farmer-darwin-arm64 signed/farmer-darwin-x64 release/
          cd release
          set -- farmer-*
          count=$#
          if [ "$count" != 7 ]; then
            echo "::error::Expected 7 binaries, found $count"
            ls -la
            exit 1
          fi
          # The install scripts download the .gz copy first. A binary is mostly
          # Bun's runtime, which compresses to less than half its size. This
          # runs after the re-sign, so each copy holds the binary that ran.
          # `-n` keeps the name and time out of the header, so the same binary
          # always gives the same copy.
          gzip -9 -k -n "$@"
          gzip -t ./*.gz
          sha256sum farmer-* > SHA256SUMS
          cat SHA256SUMS

      # `--generate-notes` wrote GitHub's own list: every pull request merged
      # since the previous release, which in a monorepo is mostly web work.
      # A person downloading a binary reads this to learn what changed in the
      # binary, so the notes are the commits that touched `apps/cli`, and the
      # compare link is there for anyone who wants the rest.
      - name: Write the release notes
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'cli-v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="$previous..$GITHUB_REF_NAME"
            heading="What changed in the CLI since $previous."
          else
            range="$GITHUB_REF_NAME"
            heading="The first release of the CLI."
          fi
          entries="$(git log --no-merges --format='- %s' \
            --invert-grep --grep='^chore(cli): release' \
            "$range" -- apps/cli)"
          {
            echo "$heading"
            echo
            if [ -n "$entries" ]; then
              echo "$entries"
            else
              echo "- Nothing under \`apps/cli\` changed. The binaries are built again from the same source."
            fi
            echo
            echo "Install it with the command under Settings → Integrations, or run \`farmer update\`."
            if [ -n "$previous" ]; then
              echo
              echo "[Every commit in between](https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME)"
            fi
          } > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Farmer CLI $VERSION" \
            --notes-file notes.md
